image:
  tag: local

# Configure spark jobs to run in:
# 1. "default" namespace explicitly (for core e2e tests)
# 2. Any namespace with "spark=enabled" label (for namespace filtering tests)
# This uses OR logic: namespace is watched if in list OR matches selector
spark:
  jobNamespaces:
    - default
  jobNamespaceSelector: "spark=enabled"

controller:
  kubeAPIQPS: 100
  kubeAPIBurst: 100
  driverPodDisruptionBudget:
    enable: true
  # Submit SparkApplications via the pure-Go native submitter (no spark-submit/JVM).
  # Native supports Scala/Java and Python cluster-mode apps (incl. the Python-based
  # spark_ui_test); R apps are not yet reproduced and are rejected at build time.
  featureGates:
    - name: NativeSubmitter
      enabled: true

webhook:
  kubeAPIQPS: 100
  kubeAPIBurst: 100
