# ============================================================================
# Midstream E2E Tests
# ============================================================================
#
# Runs the midstream RHOAI Go/Ginkgo e2e test suite with the operator
# installed via Kustomize manifests (config/default/).
#
# ============================================================================

name: Midstream E2E Test

on:
  schedule:
    - cron: '0 4 * * 1'
  pull_request:
    branches:
      - main
      - rhoai-*
    paths:
      - 'config/**'
      - 'test/e2e/rhoai/**'
      - '.github/workflows/midstream-e2e.yaml'
      - 'cmd/**'
      - 'internal/**'
      - 'api/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
  push:
    branches:
      - main
      - rhoai-*
    paths:
      - 'config/**'
      - 'test/e2e/rhoai/**'
      - '.github/workflows/midstream-e2e.yaml'
      - 'cmd/**'
      - 'internal/**'
      - 'api/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  midstream-e2e-test:
    name: Midstream E2E (K8s ${{ matrix.k8s_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        k8s_version:
          - v1.24.17
          - v1.25.16
          - v1.26.15
          - v1.27.16
          - v1.28.15
          - v1.29.12
          - v1.30.8
          - v1.31.4
          - v1.32.0
    steps:
      - name: Checkout source code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version-file: go.mod

      - name: Create a Kind cluster
        run: make kind-create-cluster KIND_K8S_VERSION=${{ matrix.k8s_version }}

      - name: Build and load image to Kind cluster
        run: make kind-load-image IMAGE_TAG=local

      - name: Run midstream RHOAI e2e tests
        run: make -C test/e2e/rhoai e2e-rhoai-test
        env:
          INSTALL_METHOD: kustomize
          SPARK_OPERATOR_IMAGE: ghcr.io/kubeflow/spark-operator/controller:local

      - name: Upload e2e coverage to Codecov
        if: always() && github.event_name == 'push'
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          files: cover-e2e-rhoai.out
          flags: e2e-rhoai
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Debug - Show cluster state
        if: failure()
        run: |
          echo "=== Pods in all namespaces ==="
          kubectl get pods -A

          echo ""
          echo "=== SparkApplications ==="
          kubectl get sparkapplications -A -o yaml 2>/dev/null || echo "No SparkApplications found"

          echo ""
          echo "=== Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -50

          echo ""
          echo "=== NetworkPolicies ==="
          kubectl get networkpolicies -A -o wide 2>/dev/null || echo "No NetworkPolicies found"

          echo ""
          echo "=== Operator logs ==="
          # The release namespace depends on the install method (the Kustomize
          # path uses the RHOAI overlay's redhat-ods-applications), so discover
          # it from the operator pods rather than hardcoding it.
          operator_ns=$(kubectl get pods -A -l app.kubernetes.io/name=spark-operator \
            -o jsonpath='{.items[0].metadata.namespace}' 2>/dev/null)
          if [ -n "$operator_ns" ]; then
            echo "(namespace: $operator_ns)"
            kubectl logs -n "$operator_ns" -l app.kubernetes.io/name=spark-operator \
              --all-containers --tail=100 2>/dev/null || echo "No operator logs"
          else
            echo "No operator pods found"
          fi

  notify-on-failure:
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    needs: [midstream-e2e-test]
    uses: ./.github/workflows/_notify-on-failure.yaml
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
