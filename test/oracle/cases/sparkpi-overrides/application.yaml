# Source-of-truth SparkApplication for the "sparkpi-overrides" oracle case.
# Exercises CRD-supplied values propagating into the driver pod. Keep in sync
# with submit-args.txt (fed to stock spark-submit by regen.sh).
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: sparkpi
  namespace: default
spec:
  type: Scala
  mode: cluster
  image: "__IMAGE__"
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: "__EXAMPLES_JAR__"
  sparkConf:
    spark.kubernetes.submission.waitAppCompletion: "false"
  driver:
    cores: 1
    memory: 1g
    serviceAccount: spark
    labels:
      env: prod
    env:
      - name: MY_ENV
        value: my-value
    nodeSelector:
      disktype: ssd
