# Admits RHOAI workbench pods to the Spark Connect server's gRPC port.
#
# On RHOAI/ODH the operator creates operand NetworkPolicies (the
# OperandNetworkPolicy feature gate), which leave the Connect server
# default-deny for ingress and admit only intra-Spark traffic. Consumer ingress
# is intentionally left to the user, so this policy is what lets a workbench
# connect. It must live in the SparkConnect server's namespace.
#
# Both selectors in the single `from` peer apply together: the namespace must be
# an RHOAI data science project AND the pod must be a workbench. An unlabelled
# pod in a data science project is still denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spark-connect-from-workbenches
  namespace: spark-workloads
spec:
  podSelector:
    matchLabels:
      spark-role: connect-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              opendatahub.io/dashboard: "true"
          podSelector:
            matchLabels:
              opendatahub.io/workbenches: "true"
      ports:
        - protocol: TCP
          port: 15002
